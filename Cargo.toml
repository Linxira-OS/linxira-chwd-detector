[package]
name = "linxira-hwd-detector"
version = "1.23.0"
authors = [
    "Vladislav Nepogodin <nepogodin.vlad@gmail.com>",
    "Linxira contributors",
]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.85"
description = "Linxira hardware detection and driver configuration tool (full CHWD port)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libpci = { path = "libpci", version = "0.2.0" }
libusb = { path = "libusb", version = "0.2.0", features = ["std", "usb-ids"] }
subprocess = "1.2"
colored = "3"
log = "0.4"
clap = { features = ["derive"], version = "4" }
anyhow = "1"
nix = { features = ["user"], default-features = false, version = "0.31" }
comfy-table = { default-features = false, version = "7" }
regex = "1.12"
once_cell = { features = ["std"], default-features = false, version = "1" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
glob = "0.3"

[build-dependencies]
clap = { features = ["derive"], version = "4" }
clap_complete = "4"

[profile.release]
strip = "symbols"
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1

[lib]
name = "lhwd"
path = "src/lib.rs"

# 2026-08-13 交接文档 Bug #2: 用户执行 `chwd -a` 报找不到命令。
# 根因: 无 [[bin]] 段时默认二进制名 = package name (linxira-chwd-detector),
# 完整 CHWD CLI 无法以 lhwd 命令调用。提供双二进制:
#   lhwd                   -> 完整 CHWD CLI (list/autoconfigure/install/remove)
#   linxira-hwd-detector   -> 无参只读 JSON 检测报告 (linxira-hardware-driver-manager 契约)
# 2026-08-13 用户决策: chwd 的 "C" 指 CachyOS, Linxira 不使用该命名,
# 命令名定为 lhwd (Linxira Hardware Detection), 包名 linxira-hwd-detector。
[[bin]]
name = "lhwd"
path = "src/main.rs"

[[bin]]
name = "linxira-hwd-detector"
path = "src/main.rs"
